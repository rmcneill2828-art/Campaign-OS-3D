name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  # barichello/godot-ci ships a real headless `godot` binary on PATH, pinned to the
  # exact 4.7.2 this project is developed/verified against (see README.md) so a CI
  # pass means the same thing a local run does.
  godot-smoke-tests:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      # A bare `--headless --script` run can't see a project's own `class_name`
      # declarations (e.g. MapScenes) until the editor has scanned and cached them
      # once -- see godot/tools/README.md's "fifth gotcha." Without this, every
      # smoke test below would fail with "Identifier not declared" even though
      # nothing is actually wrong.
      - name: Prime Godot's global class cache
        run: godot --headless --editor --path godot --quit

      - name: smoke_test_main.gd (Main.tscn loads and _ready()s clean)
        run: godot --headless --path godot --script res://tools/smoke_test_main.gd

      - name: smoke_test_player_view.gd (PlayerView.tscn loads and _ready()s clean)
        run: godot --headless --path godot --script res://tools/smoke_test_player_view.gd

      - name: smoke_test_entrance_hall.gd (Entrance Hall map resolves and loads with the expected node count)
        run: godot --headless --path godot --script res://tools/smoke_test_entrance_hall.gd

      # Unlike the three smoke tests above (load/parse/_ready() only), this actually
      # drives Main.gd through a synthetic /state response and asserts the AoE
      # Template tool's own behavior -- shape math correctness, and that placing/
      # moving/toggling a template really does auto-check/uncheck the right Area
      # Spell Targets checkboxes. See ROADMAP.md's "Seven requested features"
      # 2026-09-19 entry, item 7.
      - name: test_aoe_template.gd (AoE Template shape math + Main.gd wiring)
        run: godot --headless --path godot --script res://tools/test_aoe_template.gd

      # Covers the piece of the Character Creator that lives only in Godot -- every
      # control actually gets built, and the draft read back off them matches
      # characterCreator.js's own expected shape. The HTTP round trip itself (POST
      # /create-character against a simulated dm-bridge/watch.js) is covered by
      # engine-server's own tests/createCharacter.test.js instead, in the node-tests job.
      - name: test_character_creator.gd (Character Creator controls + draft shape)
        run: godot --headless --path godot --script res://tools/test_character_creator.gd

      # Includes a real runtime glTF parse (GLTFDocument) against a .glb already
      # committed to this repo, and a direct regression check for the "already has a
      # parent" bug found while building this (see CharacterViewer.gd's own
      # _apply_token()/Token.gd's preview_external_model() doc comments).
      - name: test_character_viewer.gd (Character Viewer scene + stats + Load Model)
        run: godot --headless --path godot --script res://tools/test_character_viewer.gd

      # Fixture strings are captured from a real running engine-server, not
      # hand-guessed -- see this test's own doc comment.
      - name: test_dice_roll.gd (roll-message extraction + tumbling die visual)
        run: godot --headless --path godot --script res://tools/test_dice_roll.gd

      # Uses a real image already committed to this repo (Kenney's Sample.png),
      # copied to a throwaway temp path -- never touches the real, gitignored
      # engine-server/state/maps/ folder.
      - name: test_raster_map.gd (adventure map import -- raster floor + generated walls)
        run: godot --headless --path godot --script res://tools/test_raster_map.gd

  # engine/*.js and dm-bridge/watch.js are supposed to be byte-for-byte copies of
  # Campaign-OS's own canonical files (see engine-server/scripts/sync-engine.sh's own
  # header comment) -- kept in sync by hand, with no shared module/package to enforce
  # it. This job is the automated guard the manual convention alone can't provide: it
  # checks out the real, canonical Campaign-OS repo alongside this one and fails loudly
  # the moment any shared file actually drifts, rather than relying on someone
  # remembering to diff them.
  engine-sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Campaign-OS-3D
        uses: actions/checkout@v4
        with:
          path: campaign-os-3d
      - name: Check out Campaign-OS (canonical engine source)
        uses: actions/checkout@v4
        with:
          repository: rmcneill2828-art/Campaign-OS
          path: campaign-os-2d
      - name: Diff shared files against their canonical Campaign-OS copies
        run: |
          set -euo pipefail
          status=0
          check() {
            local canonical="campaign-os-2d/$1"
            local copy="campaign-os-3d/$2"
            if ! diff -q "$canonical" "$copy" > /dev/null 2>&1; then
              echo "::error file=$2::$2 has drifted from the canonical Campaign-OS copy ($1). Re-run engine-server/scripts/sync-engine.sh (or sync-engine.ps1) -- or hand-sync dm-bridge/watch.js, which has no sync script -- and review the diff before committing; the 3D client may rely on behavior that just shifted."
              status=1
            fi
          }
          check engine/encounter.js engine-server/engine/encounter.js
          check engine/dmBridge.js engine-server/engine/dmBridge.js
          check engine/campaign.js engine-server/engine/campaign.js
          check engine/characterCreator.js engine-server/engine/characterCreator.js
          check dm-bridge/watch.js dm-bridge/watch.js
          exit $status
